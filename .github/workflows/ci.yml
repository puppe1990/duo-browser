name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      HUSKY: '0'
      DUO_USE_SYSTEM_SDK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Swift formatter
        run: brew install swift-format
      - run: npm ci
      - name: Tests, lint and formatting
        run: npm run check
